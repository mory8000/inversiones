# Publica la app en GitHub Pages → https://mory8000.github.io/inversiones/
#
# Se ejecuta con cada push a la rama de trabajo `arena/fc3a1d34-inversiones`
# (y también a `main`), así que no hace falta abrir ningún PR para publicar.
#
# Requisitos (una sola vez, en Settings del repositorio):
#   1. Pages → Build and deployment → Source: "GitHub Actions".
#   2. Environments → github-pages → Deployment branches and tags:
#      permitir la rama `arena/fc3a1d34-inversiones` (por defecto solo `main`).

name: Publicar en GitHub Pages

on:
  push:
    branches:
      - main
      - arena/fc3a1d34-inversiones
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez. No se cancela una que ya está en marcha
# (recomendación de GitHub para Pages); si llegan varias, se publica la última.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Comprobar y construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Construir
        run: npm run build

      # Garantía de privacidad: no se publica nada sin la política que impide
      # a la app conectarse a otros servidores (ver vite.config.ts).
      - name: Comprobar la política de seguridad (CSP)
        run: grep -q "connect-src 'self'" dist/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
